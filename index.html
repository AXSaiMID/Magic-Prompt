<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Prompt</title>
  <!--
    Este arquivo existe apenas para permitir publicar o projeto pelo GitHub Pages
    escolhendo a RAIZ do repositório como pasta de origem.

    - Se você publicar pela pasta `/docs` (recomendado), este arquivo é ignorado.
    - Se publicar pela raiz, ele encaminha o visitante para a página estática em /docs/.
  -->
  <meta http-equiv="refresh" content="0; url=./docs/" />
  <link rel="canonical" href="./docs/" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           background: #f6f7fb; color: #1f2233; display: grid; place-items: center;
           min-height: 100vh; margin: 0; padding: 24px; }
    .caixa { background: #fff; border: 1px solid #e3e5ee; border-radius: 12px; padding: 28px 30px;
             max-width: 560px; box-shadow: 0 1px 2px rgba(24,26,44,.06), 0 6px 20px rgba(24,26,44,.06); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #5b6075; margin: 0 0 14px; line-height: 1.55; }
    a.botao { display: inline-block; background: #6c4ce0; color: #fff; text-decoration: none;
              padding: 10px 16px; border-radius: 8px; font-weight: 550; font-size: 14px; }
    code { background: #f2f3f8; padding: 1px 5px; border-radius: 4px;
           font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>✨ Magic Prompt</h1>
    <p>
      A página do gerador de prompts fica em <code>/docs/</code>. Você está sendo
      encaminhado para lá automaticamente.
    </p>
    <p>
      Se preferir, publique o GitHub Pages escolhendo a pasta <code>/docs</code> como
      origem (Settings → Pages) — assim este arquivo deixa de ser necessário.
    </p>
    <a class="botao" href="./docs/">Abrir o Magic Prompt →</a>
  </div>
  <script>window.location.replace('./docs/');</script>
</body>
</html>
